name: Check Infraestructura Lite

on:
  push:
    branches:
      - feature/infraestructura-lite-v1
    paths:
      - infraestructura/**
      - functions-infra/**
      - scripts/build-infraestructura-lite.py
      - .github/workflows/check-infraestructura-lite.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate protected datasets
        run: python3 scripts/build-infraestructura-lite.py

      - name: Check frontend syntax
        run: |
          node --check infraestructura/app.js
          node --check infraestructura/access.js

      - name: Check backend syntax
        run: node --check functions-infra/index.js

      - name: Check deployment scripts
        run: |
          bash -n scripts/deploy-infraestructura-lite.sh
          bash -n scripts/provision-infraestructura-user.sh

      - name: Check protected datasets
        run: |
          test -s functions-infra/data/network.json
          test -s functions-infra/data/cruces.json
          test -s functions-infra/data/interferencias.json
